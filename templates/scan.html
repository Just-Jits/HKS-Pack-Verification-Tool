<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pack Verify</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    #scan-input {
      position: fixed;
      top: -100px;
      opacity: 0;
    }
    .header {
      font-size: 14px;
      color: #888;
      text-align: center;
      margin-bottom: 10px;
    }
    .idle {
      text-align: center;
      padding: 80px 20px;
      font-size: 28px;
      color: #555;
    }
    .order-card {
      max-width: 700px;
      margin: 0 auto;
    }
    .order-title {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 4px;
    }
    .order-shop {
      text-align: center;
      color: #888;
      margin-bottom: 20px;
    }
    .line-item {
      background: #1d1d1d;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      border: 2px solid #333;
      transition: all 0.15s ease;
    }
    .line-item.complete {
      border-color: #2ecc71;
      background: #102a1a;
    }
    .line-item.flash-green {
      border-color: #2ecc71;
      background: #1d6b3d;
    }
    .line-item.flash-red {
      border-color: #e74c3c;
      background: #6b1d1d;
    }
    .qty-badge {
      font-weight: bold;
      font-size: 18px;
      padding: 4px 14px;
      border-radius: 20px;
      background: #333;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .qty-badge.complete { background: #2ecc71; color: #000; }
    .manual-confirm {
      flex: none;
      padding: 8px 14px;
      font-size: 13px;
      background: #333;
      color: #ccc;
      border-radius: 6px;
    }
    .manual-confirm:hover { background: #444; }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    button {
      flex: 1;
      padding: 16px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    #btn-complete {
      background: #2ecc71;
      color: #000;
    }
    #btn-complete:disabled {
      background: #2a4a36;
      color: #555;
      cursor: not-allowed;
    }
    #btn-incomplete {
      background: #e74c3c;
      color: #fff;
    }
    .missing-picker {
      max-width: 700px;
      margin: 20px auto;
      background: #1d1d1d;
      border-radius: 12px;
      padding: 16px;
    }
    .missing-picker label {
      display: block;
      padding: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    .missing-picker input { margin-right: 10px; transform: scale(1.5); }
    .error-banner {
      max-width: 700px;
      margin: 0 auto;
      background: #6b1d1d;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
    }
    .warn-banner {
      max-width: 700px;
      margin: 0 auto 16px auto;
      background: #4a3a10;
      border: 2px solid #e7a23c;
      padding: 14px 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
      color: #f0c47a;
    }
    .express-banner {
      max-width: 700px;
      margin: 0 auto 16px auto;
      background: #5a1a1a;
      border: 2px solid #ff4d4d;
      padding: 16px 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      color: #ffb3b3;
    }
    .express-banner button {
      margin-top: 10px;
      background: #ff4d4d;
      color: #fff;
    }
    #visible-input-wrap {
      max-width: 700px;
      margin: 0 auto 16px auto;
      text-align: center;
    }
    #visible-input {
      background: #1d1d1d;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 16px;
      width: 260px;
    }
  </style>
</head>
<body>
  <input type="text" id="scan-input" autofocus>
  <div class="header">Scan an order barcode to begin</div>
  <div id="visible-input-wrap">
    <input type="text" id="visible-input" placeholder="Or type order/product number here">
  </div>
  <div id="content">
    <div class="idle">📦 Ready to scan</div>
  </div>

  <audio id="sound-ding" src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" preload="auto"></audio>

  <script>
    const input = document.getElementById('scan-input');
    const content = document.getElementById('content');
    let currentOrder = null; // { shop, order_id, order_number, line_items: [{...,scanned_count}] }
    let buffer = "";
    let bufferTimer = null;

    // keep focus on hidden input always, so scanner keystrokes land here —
    // but don't steal focus if the person is actively using the visible fallback field
    function refocus() {
      if (document.activeElement !== visibleInput) {
        input.focus();
      }
    }
    setInterval(refocus, 500);
    document.addEventListener('click', (e) => {
      if (e.target !== visibleInput) refocus();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleScan(input.value.trim());
        input.value = "";
      }
    });

    const visibleInput = document.getElementById('visible-input');
    visibleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleScan(visibleInput.value.trim());
        visibleInput.value = "";
      }
    });

    function beep(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = type === 'good' ? 880 : 200;
      gain.gain.value = 0.3;
      osc.start();
      osc.stop(ctx.currentTime + (type === 'good' ? 0.15 : 0.35));
    }

    function handleScan(value) {
      if (!value) return;

      if (!currentOrder) {
        // treat as order number scan
        lookupOrder(value);
        return;
      }

      // treat as product barcode scan against current order
      matchProduct(value);
    }

    async function lookupOrder(orderNumber) {
      content.innerHTML = `<div class="idle">Looking up order ${orderNumber}...</div>`;
      try {
        const res = await fetch(`/api/lookup_order?order_number=${encodeURIComponent(orderNumber)}`);
        const data = await res.json();
        if (data.error) {
          content.innerHTML = `<div class="error-banner">${data.error}</div>`;
          beep('bad');
          setTimeout(() => { currentOrder = null; renderIdle(); }, 2500);
          return;
        }
        currentOrder = data;
        currentOrder.line_items = currentOrder.line_items.map(li => ({...li, scanned_count: 0}));
        renderOrder();
      } catch (err) {
        content.innerHTML = `<div class="error-banner">Error: ${err.message || 'failed to reach server'}</div>`;
      }
    }

    function matchProduct(barcode) {
      const items = currentOrder.line_items;
      // find an item with this barcode (or sku as fallback) that isn't fully scanned yet
      let match = items.find(li => (li.barcode === barcode || li.sku === barcode) && li.scanned_count < li.quantity);

      if (!match) {
        // check if it's a valid item but already fully scanned (over-scan)
        let overscan = items.find(li => li.barcode === barcode || li.sku === barcode);
        beep('bad');
        flashOrderRed();
        renderOrder(overscan ? `Already scanned all of: ${overscan.title}` : `Not in this order: ${barcode}`);
        return;
      }

      match.scanned_count += 1;
      beep('good');
      renderOrder();
    }

    function flashOrderRed() {
      // visual handled via re-render message; could enhance with full-screen flash
    }

    function renderIdle() {
      content.innerHTML = `<div class="idle">📦 Ready to scan</div>`;
    }

    function resetItem(idx) {
      const li = currentOrder.line_items[idx];
      if (li.scanned_count > 0) {
        li.scanned_count -= 1;
      }
      renderOrder();
    }

    function manualConfirm(idx) {
      const li = currentOrder.line_items[idx];
      li.scanned_count = Math.min(li.scanned_count + 1, li.quantity);
      beep('good');
      renderOrder();
    }

    function renderOrder(message) {
      const items = currentOrder.line_items.map((li, idx) => {
        const complete = li.scanned_count >= li.quantity;
        const noBarcode = !li.barcode;
        return `
          <div class="line-item ${complete ? 'complete' : ''}">
            <div>
              ${li.title}${li.sku ? ' <span style="color:#888;font-size:14px;">(' + li.sku + ')</span>' : ''}
              ${noBarcode ? '<div style="color:#e7a23c;font-size:13px;margin-top:4px;">No barcode on file — tap Confirm to verify by hand</div>' : ''}
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="qty-badge ${complete ? 'complete' : ''}" onclick="resetItem(${idx})" style="cursor:pointer;" title="Tap to undo last scan">${li.scanned_count} / ${li.quantity}</div>
              ${!complete ? `<button class="manual-confirm" onclick="manualConfirm(${idx})">Confirm</button>` : ''}
            </div>
          </div>
        `;
      }).join("");

      const allDone = currentOrder.line_items.every(li => li.scanned_count >= li.quantity);
      const expressBlocked = currentOrder.needs_express_tag && !currentOrder.express_confirmed;
      const canMarkReady = allDone && !expressBlocked;

      let weightBannerHtml = "";
      if (currentOrder.weight_warning) {
        weightBannerHtml = `<div class="warn-banner">⚠️ ${currentOrder.weight_warning} (est. ${currentOrder.estimated_weight_kg}kg)</div>`;
      }

      let expressBannerHtml = "";
      if (currentOrder.needs_express_tag) {
        if (currentOrder.express_confirmed) {
          expressBannerHtml = `<div class="warn-banner">✅ Express upgrade confirmed in AusPost</div>`;
        } else {
          expressBannerHtml = `
            <div class="express-banner">
              🚀 EXPRESS REQUIRED — go set this order to Express in the AusPost app before packing<br>
              <button onclick="confirmExpress()">✅ I've set this to Express</button>
            </div>
          `;
        }
      }

      content.innerHTML = `
        <div class="order-card">
          <div class="order-title">Order ${currentOrder.order_number}</div>
          <div class="order-shop">${currentOrder.shop}${currentOrder.customer ? ' — ' + currentOrder.customer : ''}</div>
          ${expressBannerHtml}
          ${weightBannerHtml}
          ${message ? `<div class="error-banner" style="margin-bottom:16px;">${message}</div>` : ""}
          ${items}
          <div class="actions">
            <button id="btn-complete" ${canMarkReady ? "" : "disabled"} onclick="completeOrder()">✅ Mark Ready</button>
            <button id="btn-incomplete" onclick="showMissingPicker()">⚠️ Missing Item</button>
          </div>
          <div id="missing-area"></div>
        </div>
      `;
    }

    function confirmExpress() {
      currentOrder.express_confirmed = true;
      renderOrder();
    }

    function showMissingPicker() {
      const area = document.getElementById('missing-area');
      const options = currentOrder.line_items.map((li, idx) => `
        <label>
          <input type="checkbox" value="${idx}"> ${li.title} (need ${li.quantity}, have ${li.scanned_count})
        </label>
      `).join("");
      area.innerHTML = `
        <div class="missing-picker">
          <div style="margin-bottom:10px; font-weight:bold;">Which item(s) are missing?</div>
          ${options}
          <button style="margin-top:10px; background:#e74c3c; color:#fff;" onclick="submitIncomplete()">Confirm — Mark Incomplete</button>
        </div>
      `;
    }

    async function submitIncomplete() {
      const checked = Array.from(document.querySelectorAll('.missing-picker input:checked'));
      const missing = checked.map(c => currentOrder.line_items[parseInt(c.value)]);

      const res = await fetch('/api/mark_order', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          shop: currentOrder.shop,
          order_id: currentOrder.order_id,
          status: 'incomplete',
          missing_items: missing.map(m => ({title: m.title, sku: m.sku}))
        })
      });
      const data = await res.json();
      if (!data.ok) {
        alert('Failed to tag order as incomplete: ' + JSON.stringify(data.detail || data.error));
        return;
      }

      currentOrder = null;
      renderIdle();
    }

    async function completeOrder() {
      const res = await fetch('/api/mark_order', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          shop: currentOrder.shop,
          order_id: currentOrder.order_id,
          status: 'ready'
        })
      });
      const data = await res.json();
      if (!data.ok) {
        alert('Failed to mark order ready: ' + JSON.stringify(data.detail || data.error));
        return;
      }

      currentOrder = null;
      renderIdle();
    }
  </script>
</body>
</html>
